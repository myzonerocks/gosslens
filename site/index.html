<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/mark.svg" />
    <title>gosslens</title>
    <meta name="description" content="A real-time vision and AR engine. Faces, hands, planes, depth and text out of every camera frame, on the device, behind one C ABI for iOS, Android and the web." />
    <meta name="theme-color" content="#0b0a11" />
    <meta property="og:title" content="gosslens" />
    <meta property="og:description" content="See what the camera sees and draw straight back onto it. One core, one ABI, four SDKs." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/mark.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Reads the saved theme before the first paint, so nobody sees the wrong one flash. -->
    <script>
      try {
        var saved = localStorage.getItem('gosslens:theme')
        document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark')
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'dark')
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

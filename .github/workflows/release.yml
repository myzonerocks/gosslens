name: release

# A vX.Y.Z tag cross-compiles the core per target, gates each slice, and attaches
# the prebuilt binaries to the GitHub Release so an app developer never installs
# Zig: a jniLibs zip, a checksummed XCFramework for SwiftPM, and the .wasm in an
# npm tarball. Registry pushes are guarded by secrets; a tag always yields assets.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Manual trigger. With an empty version it is a dry run: builds and gates
  # every slice, publishes nothing. With a version it is a full release: it
  # creates the vX.Y.Z tag on the current commit and publishes everything.
  workflow_dispatch:
    inputs:
      version:
        description: "Version like 0.9.0 to tag, build, and publish. Empty runs a dry run that publishes nothing."
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # Required for npm publish --provenance to mint its signed attestation.
  id-token: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # The pinned toolchain, the synced vendors, and zig's incremental caches:
      # a pin change rebuilds from scratch, anything else restores warm.
      - uses: actions/cache@v4
        with:
          path: .local/zig
          key: zig-${{ runner.os }}-${{ hashFiles('.zigversion') }}
      - uses: actions/cache@v4
        with:
          path: |
            .vendor
            .vendor-archives
          key: vendor-android-${{ runner.os }}-${{ hashFiles('third_party/**') }}
          restore-keys: |
            vendor-android-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigbuild-android-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
          restore-keys: |
            zigbuild-android-${{ runner.os }}-${{ hashFiles('.zigversion') }}-
      - name: toolchain
        run: |
          tools/toolchain-sync
          echo "$PWD/.local/zig/current" >> "$GITHUB_PATH"
      - name: vendor sync
        run: zig build vendor-sync
      - name: build android libraries
        run: zig build android
      # 16 KB page alignment is a hard Play gate: an unaligned .so fails to mmap
      # on a 16 KB-page device. Fail the release unless every LOAD segment aligns
      # to at least 2**14, and confirm a Java_com_gosslens_ JNI export is present.
      - name: alignment and symbol gates
        run: |
          set -euo pipefail
          shopt -s nullglob
          # readelf ships with binutils and reads any-arch ELF headers, so it
          # avoids the llvm-objdump the runner lacks. LOAD align is the last field
          # (hex); a dynamic symbol's name is the last field of a dyn-syms row.
          found=0
          for so in zig-out/android/*/libgosslens.so; do
            found=1
            abi=$(basename "$(dirname "$so")")
            align=$(readelf -lW "$so" | awk '/LOAD/ {print $NF; exit}')
            echo "== $so ($abi) LOAD align $align =="
            [ -n "$align" ] || { echo "FAIL: could not read the LOAD alignment of $so"; exit 1; }
            # 16 KB pages are an arm64 device requirement; x86_64 is emulator-only
            # and links at 4 KB, so enforce alignment only on the arm ABIs.
            case "$abi" in
              arm64-v8a|armeabi-v7a)
                [ "$((align))" -ge 16384 ] || { echo "FAIL: $so LOAD alignment $align is below 16 KB"; exit 1; } ;;
              *) echo "note: $abi is emulator-only; 16 KB alignment not enforced" ;;
            esac
            # The android .so exposes the JNI entry points the kotlin SDK binds.
            # awk consumes the whole dump: grep -q would quit at the first hit,
            # SIGPIPE readelf mid-write, and fail the check under pipefail.
            readelf -W --dyn-syms "$so" | awk '$NF ~ /^Java_com_gosslens_/ { found = 1 } END { exit !found }' \
              || { echo "FAIL: $so exports no Java_com_gosslens_ JNI entry point"; exit 1; }
          done
          [ "$found" = 1 ] || { echo "FAIL: no libgosslens.so was built"; exit 1; }
      - name: package jniLibs
        run: |
          set -euo pipefail
          ( cd zig-out/android && zip -r "$GITHUB_WORKSPACE/gosslens-android-jniLibs.zip" . -i '*/libgosslens.so' )
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: gosslens-android-jniLibs.zip
          if-no-files-found: error

  apple:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # The pinned toolchain, the synced vendors, and zig's incremental caches:
      # a pin change rebuilds from scratch, anything else restores warm.
      - uses: actions/cache@v4
        with:
          path: .local/zig
          key: zig-${{ runner.os }}-${{ hashFiles('.zigversion') }}
      - uses: actions/cache@v4
        with:
          path: |
            .vendor
            .vendor-archives
          key: vendor-apple-${{ runner.os }}-${{ hashFiles('third_party/**') }}
          restore-keys: |
            vendor-apple-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigbuild-apple-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
          restore-keys: |
            zigbuild-apple-${{ runner.os }}-${{ hashFiles('.zigversion') }}-
      - name: toolchain
        run: |
          tools/toolchain-sync
          echo "$PWD/.local/zig/current" >> "$GITHUB_PATH"
      - name: vendor sync
        run: zig build vendor-sync
      - name: build apple slices
        run: |
          zig build ios
          zig build ios-simulator
          zig build ios-simulator-x86
      # Device and simulator are different platforms to Apple and cannot share
      # one universal binary. A known Zig bug has mis-tagged the simulator slice
      # as device, so surface the platform load command before packaging.
      - name: platform load-command gate
        run: |
          set -euo pipefail
          for a in zig-out/ios/libgosslens.a zig-out/ios-simulator/libgosslens.a; do
            [ -e "$a" ] || { echo "FAIL: missing $a"; exit 1; }
            echo "== $a =="
            vtool -show "$a" 2>/dev/null | grep -iE "platform|minos" || true
          done
      # The engine ships as many static archives; merge each platform's archives
      # into one static library, then wrap the two platforms in an XCFramework
      # with the header and a module map so Swift can `import`.
      - name: assemble xcframework
        run: |
          set -euo pipefail
          mkdir -p headers
          cp include/gosslens.h headers/
          printf 'module CGosslens {\n  header "gosslens.h"\n  export *\n}\n' > headers/module.modulemap
          libtool -static -o device.a zig-out/ios/*.a
          # The simulator slice is universal: merge each arch's archives, then
          # lipo the two into one fat library so the XCFramework runs on both
          # Apple-silicon and Intel Macs.
          libtool -static -o sim-arm64.a zig-out/ios-simulator/*.a
          libtool -static -o sim-x86_64.a zig-out/ios-simulator-x86_64/*.a
          lipo -create sim-arm64.a sim-x86_64.a -output sim.a
          xcodebuild -create-xcframework \
            -library device.a -headers headers \
            -library sim.a -headers headers \
            -output GosslensKit.xcframework
          zip -ry GosslensKit.xcframework.zip GosslensKit.xcframework
          swift package compute-checksum GosslensKit.xcframework.zip > GosslensKit.checksum.txt
          cat GosslensKit.checksum.txt
      - uses: actions/upload-artifact@v4
        with:
          name: apple
          path: |
            GosslensKit.xcframework.zip
            GosslensKit.checksum.txt
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # The pinned toolchain, the synced vendors, and zig's incremental caches:
      # a pin change rebuilds from scratch, anything else restores warm. The
      # vendor cache carries the emscripten SDK, the web job's largest fetch.
      - uses: actions/cache@v4
        with:
          path: .local/zig
          key: zig-${{ runner.os }}-${{ hashFiles('.zigversion') }}
      - uses: actions/cache@v4
        with:
          path: |
            .vendor
            .vendor-archives
          key: vendor-web-${{ runner.os }}-${{ hashFiles('third_party/**') }}
          restore-keys: |
            vendor-web-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigbuild-web-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
          restore-keys: |
            zigbuild-web-${{ runner.os }}-${{ hashFiles('.zigversion') }}-
      - name: toolchain
        run: |
          tools/toolchain-sync
          echo "$PWD/.local/zig/current" >> "$GITHUB_PATH"
      - name: vendor sync
        # emscripten and emscripten-python are excluded from the default sync
        # (large, single-use), but the web engine build requires them.
        run: |
          zig build vendor-sync
          zig build vendor-sync -- --only emscripten
          zig build vendor-sync -- --only emscripten-python
      - uses: oven-sh/setup-bun@v2
      - name: pack the js wrapper
        run: |
          set -euo pipefail
          cd sdk/ts
          bun install
          bun run build
          bun pm pack --destination "$GITHUB_WORKSPACE"
      # The web engine the wrapper drives is the emscripten build a consumer
      # hosts next to their app. Best effort: it needs the emscripten SDK, so a
      # missing EMSDK never blocks the wrapper publish or the rest of the release.
      - name: build the web engine (best effort)
        continue-on-error: true
        run: |
          set -euo pipefail
          zig build wasm-emscripten
          zig build wasm-emscripten-webgpu
          zig build tracking-wasm
          mkdir -p web-engine/webgpu
          cp zig-out/wasm-emscripten/gosslens_web.js zig-out/wasm-emscripten/gosslens_web.wasm web-engine/
          cp zig-out/wasm-emscripten-webgpu/gosslens_web.js zig-out/wasm-emscripten-webgpu/gosslens_web.wasm web-engine/webgpu/
          cp zig-out/wasm/gosslens_tracking.wasm web-engine/
          ( cd web-engine && zip -r "$GITHUB_WORKSPACE/gosslens-web-engine.zip" . )
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: |
            *.tgz
            gosslens-web-engine.zip
          if-no-files-found: error

  publish:
    needs: [android, apple, web]
    # Publishes on a real vX.Y.Z tag, or on a manual dispatch that named a
    # version. A dispatch with no version stops after the build and gate jobs.
    if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.version != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets are not readable in step `if:`, so surface their presence through
    # job env the steps can test. RELEASE_TAG is the tag from a tag push, or
    # v<version> from a dispatched release.
    env:
      HAS_MAVEN: ${{ secrets.OSSRH_USERNAME != '' }}
      HAS_NPM: ${{ secrets.NPM_TOKEN != '' }}
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: attach assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Clear any prior release and tag of this name so a re-run recreates
            # them cleanly on the current commit.
            gh release delete "${RELEASE_TAG}" --yes --cleanup-tag 2>/dev/null || true
            git push origin ":refs/tags/${RELEASE_TAG}" 2>/dev/null || true
            target=(--target "${GITHUB_SHA}")
          fi
          notes="SwiftPM binaryTarget checksum: $(cat dist/apple/GosslensKit.checksum.txt)"
          assets=(dist/android/gosslens-android-jniLibs.zip dist/apple/GosslensKit.xcframework.zip dist/web/*.tgz)
          [ -f dist/web/gosslens-web-engine.zip ] && assets+=(dist/web/gosslens-web-engine.zip)
          gh release create "${RELEASE_TAG}" "${target[@]}" "${assets[@]}" --title "${RELEASE_TAG}" --notes "$notes"
      # Pin SwiftPM to the XCFramework this release just published, so Swift
      # consumers get the prebuilt engine with no Zig. Best effort: if main is
      # protected the push is skipped and the values are printed to pin by hand.
      - name: pin the swift binary target on main
        # Best effort: pinning commits to protected main, so never let it block
        # the registry publishes that follow.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          # A PAT that bypasses main's branch rule lets the pin self-commit; add
          # RELEASE_PAT as a secret and to the ruleset's bypass list. Without it
          # the default token push is rejected and the pin is a one-line PR.
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          checksum=$(cat dist/apple/GosslensKit.checksum.txt)
          git config user.name avosa
          git config user.email avosa.developer@gmail.com
          git fetch origin main && git checkout main
          tools/pin-swift-xcframework.sh "${RELEASE_TAG}" "${checksum}"
          if git diff --quiet sdk/swift/Package.swift; then exit 0; fi
          git add sdk/swift/Package.swift
          git commit -m "release ${RELEASE_TAG}: pin the swift xcframework binary target"
          if [ -n "${RELEASE_PAT:-}" ]; then
            git push "https://x-access-token:${RELEASE_PAT}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          else
            git push origin main || echo "note: no RELEASE_PAT and the branch rule blocks the token push; pin via a one-line PR (tools/pin-swift-xcframework.sh)"
          fi
      # Registry pushes need credentials, so they run only when the secrets are
      # set. Without them the Release still carries every installable binary.
      - name: set up jdk 21 for gradle
        if: ${{ env.HAS_MAVEN == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: set up the android sdk for gradle
        if: ${{ env.HAS_MAVEN == 'true' }}
        uses: android-actions/setup-android@v3
      - name: publish to maven central
        if: ${{ env.HAS_MAVEN == 'true' }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          # Restore the CI-built .so where gradle's jniLibs srcDir expects it, so
          # the published AAR carries the prebuilt binary. The fresh checkout has
          # no zig-out, so create it before unzipping into it.
          mkdir -p zig-out/android
          unzip -o dist/android/gosslens-android-jniLibs.zip -d zig-out/android
          cd sdk/kotlin
          ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache -PVERSION_NAME="${RELEASE_TAG#v}"
      - name: publish to npm
        if: ${{ env.HAS_NPM == 'true' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish --access public --provenance dist/web/*.tgz

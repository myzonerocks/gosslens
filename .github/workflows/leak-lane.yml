name: leak-lane

# The scheduled native-heap watcher. The zig debug allocator gates zig
# allocations; this lane runs the identical headless lifecycle scenario
# under the platform malloc leak checker, so a leak on the C or C++
# heap a vendored engine allocates on fails the lane with a stack.

on:
  schedule:
    - cron: "7 4 * * *"
  workflow_dispatch: {}

concurrency:
  group: leak-lane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-heap:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          tools/toolchain-sync
          echo "$PWD/.local/zig/current" >> "$GITHUB_PATH"
      - name: vendor sync
        run: zig build vendor-sync
      - name: fetch models
        run: zig build fetch-models
      - name: build the scenario
        run: zig build leak-scenario
      - name: run under the malloc leak checker
        run: |
          set -euo pipefail
          export MallocStackLogging=1
          leaks --atExit -- ./zig-out/bin/gosslens-leak-scenario

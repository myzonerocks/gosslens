name: cold

# The from-scratch audit lane: no cache restore anywhere, so a warm run
# that only passed because a derived key omitted an input diverges here.
# A cold failure on a sha whose warm gates were green is an incident.

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch: {}
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    paths:
      - ".zigversion"
      - "third_party/**"
      - "tools/abi-baseline.txt"

concurrency:
  group: cold-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: toolchain
        run: |
          tools/toolchain-sync
          echo "$PWD/.local/zig/current" >> "$GITHUB_PATH"
      - name: vendor sync
        run: zig build vendor-sync
      - name: fetch models
        run: zig build fetch-models
      # One compiler process peaks near 15 GB on these targets, which is the
      # whole runner; the build finished with 103 MB to spare and all of the
      # stock swap used, so give it somewhere to go before it starts.
      - name: swap headroom
        run: |
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -m
      - name: gate suite, cold
        run: |
          ( while :; do
              echo "RES $(date -u +%H:%M:%S) avail=$(free -m | awk '/^Mem:/{print $7}')MB swap=$(free -m | awk '/^Swap:/{print $3}')MB root_free=$(df -m / | awk 'NR==2{print $4}')MB top=$(ps -eo rss=,comm= --sort=-rss 2>/dev/null | head -3 | awk '{printf "%s:%dMB ", $2, $1/1024}' || true)"
              sleep 3
            done ) &
          res_pid=$!
          trap 'kill $res_pid 2>/dev/null || true' EXIT
          zig build ci
      - name: divergence note
        if: failure()
        run: echo "cold diverged from warm on ${{ github.sha }}; a derived cache key omitted an input. Treat as an incident." >> "$GITHUB_STEP_SUMMARY"

  tracking:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: toolchain
        run: |
          tools/toolchain-sync
          echo "$PWD/.local/zig/current" >> "$GITHUB_PATH"
      - name: vendor sync
        run: zig build vendor-sync
      - name: fetch models
        run: zig build fetch-models
      - name: tracking harness
        run: zig build tracking-harness

  macos:
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: toolchain
        run: |
          tools/toolchain-sync
          echo "$PWD/.local/zig/current" >> "$GITHUB_PATH"
      - name: vendor sync
        run: zig build vendor-sync
      - name: fetch models
        run: zig build fetch-models
      - name: build and test
        run: zig build test --summary all
        env:
          GOSS_PROBES: "1"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: toolchain
        run: |
          tools/toolchain-sync
          echo "$PWD/.local/zig/current" >> "$GITHUB_PATH"
      - name: vendor sync
        run: zig build vendor-sync
      # One job per core put the 16 GB runner into the kernel's reaper on every
      # attempt, which arrives as a bare "shutdown signal"; three ABIs of the
      # vendored C++ do not fit four at a time.
      # One compiler process peaks near 15 GB on these targets, which is the
      # whole runner; the build finished with 103 MB to spare and all of the
      # stock swap used, so give it somewhere to go before it starts.
      - name: swap headroom
        run: |
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -m
      - name: android library
        run: |
          ( while :; do
              echo "RES $(date -u +%H:%M:%S) avail=$(free -m | awk '/^Mem:/{print $7}')MB swap=$(free -m | awk '/^Swap:/{print $3}')MB root_free=$(df -m / | awk 'NR==2{print $4}')MB top=$(ps -eo rss=,comm= --sort=-rss 2>/dev/null | head -3 | awk '{printf "%s:%dMB ", $2, $1/1024}' || true)"
              sleep 3
            done ) &
          res_pid=$!
          trap 'kill $res_pid 2>/dev/null || true' EXIT
          zig build android

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: install
        run: cd sdk/ts && bun install
      - name: build
        run: cd sdk/ts && bun run build
      - name: test
        run: cd sdk/ts && bun test

  lens-shaders:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: toolchain
        run: |
          tools/toolchain-sync
          echo "$PWD/.local/zig/current" >> "$GITHUB_PATH"
      - name: vendor sync
        run: zig build vendor-sync
      # Each test binary is its own zig process with its own thread pool, and
      # four of them together is more memory than the runner has.
      # One compiler process peaks near 15 GB on these targets, which is the
      # whole runner; the build finished with 103 MB to spare and all of the
      # stock swap used, so give it somewhere to go before it starts.
      - name: swap headroom
        run: |
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -m
      - name: lens validator shader tests
        run: |
          ( while :; do
              echo "RES $(date -u +%H:%M:%S) avail=$(free -m | awk '/^Mem:/{print $7}')MB swap=$(free -m | awk '/^Swap:/{print $3}')MB root_free=$(df -m / | awk 'NR==2{print $4}')MB top=$(ps -eo rss=,comm= --sort=-rss 2>/dev/null | head -3 | awk '{printf "%s:%dMB ", $2, $1/1024}' || true)"
              sleep 3
            done ) &
          res_pid=$!
          trap 'kill $res_pid 2>/dev/null || true' EXIT
          zig build test -Dlens-shaders=true -j1
      - name: validate reference lenses
        run: zig build lens-validate-reference

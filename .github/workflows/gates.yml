name: gates

# Push runs on main exist to validate the merge and to save the warm
# build caches; pull request runs restore those caches and never save
# compilation state, so the shared cache pool stays unevicted and every
# fresh branch starts from main's warm world instead of a cold build.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The runner uses the repository's flake, so it builds with the zig 0.16.0 a developer's
      # shell has, pinned by flake.lock.
      - name: set up nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: pr body shape
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_body.txt"
          nix develop -c zig build gate -- --pr-body "$RUNNER_TEMP/pr_body.txt"
      - name: commit provenance
        if: github.event_name == 'pull_request'
        run: nix develop -c zig build gate -- --log "origin/${{ github.base_ref }}..HEAD"
      - uses: actions/cache@v4
        id: vendor
        with:
          path: |
            .vendor
            .vendor-archives
          key: vendor-${{ hashFiles('third_party/**/pin.zon') }}
      - name: vendor sync
        run: nix develop -c zig build vendor-sync
      - uses: actions/cache@v4
        id: models
        with:
          path: .models
          key: models-${{ hashFiles('third_party/models.lock') }}
      - name: fetch models
        run: nix develop -c zig build fetch-models
      - uses: actions/cache/restore@v4
        id: zigcache
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
          restore-keys: |
            zigcache-${{ runner.os }}-${{ hashFiles('.zigversion') }}-
      - name: gate suite
        run: nix develop -c zig build ci
        env:
          GOSS_PROBES: "1"
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
      - name: cache health
        if: always()
        run: |
          {
            echo "cache health: vendor=${{ steps.vendor.outputs.cache-hit || 'miss' }} models=${{ steps.models.outputs.cache-hit || 'miss' }} zigcache=${{ steps.zigcache.outputs.cache-matched-key || 'miss' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  tracking:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # The runner uses the repository's flake, so it builds with the zig 0.16.0 a developer's
      # shell has, pinned by flake.lock.
      - name: set up nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: actions/cache@v4
        id: vendor
        with:
          path: |
            .vendor
            .vendor-archives
          key: vendor-${{ hashFiles('third_party/**/pin.zon') }}
      - name: vendor sync
        run: nix develop -c zig build vendor-sync
      - uses: actions/cache@v4
        id: models
        with:
          path: .models
          key: models-${{ hashFiles('third_party/models.lock') }}
      - name: fetch models
        run: nix develop -c zig build fetch-models
      - uses: actions/cache/restore@v4
        id: zigcache
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-tracking-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
          restore-keys: |
            zigcache-tracking-${{ runner.os }}-${{ hashFiles('.zigversion') }}-
      - name: tracking harness
        run: nix develop -c zig build tracking-harness
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-tracking-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
      - name: cache health
        if: always()
        run: |
          {
            echo "cache health: vendor=${{ steps.vendor.outputs.cache-hit || 'miss' }} models=${{ steps.models.outputs.cache-hit || 'miss' }} zigcache=${{ steps.zigcache.outputs.cache-matched-key || 'miss' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  macos-build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # The runner uses the repository's flake, so it builds with the zig 0.16.0 a developer's
      # shell has, pinned by flake.lock.
      - name: set up nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: actions/cache@v4
        id: vendor
        with:
          path: |
            .vendor
            .vendor-archives
          key: vendor-${{ hashFiles('third_party/**/pin.zon') }}
      - name: vendor sync
        run: nix develop -c zig build vendor-sync
      - uses: actions/cache@v4
        id: models
        with:
          path: .models
          key: models-${{ hashFiles('third_party/models.lock') }}
      - name: fetch models
        run: nix develop -c zig build fetch-models
      - uses: actions/cache/restore@v4
        id: zigcache
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-conformance-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
          restore-keys: |
            zigcache-conformance-${{ runner.os }}-${{ hashFiles('.zigversion') }}-
      # Full GPU conformance needs a window and a display, so it stays the local
      # merge bar. This job gives the macOS-only coverage a Linux runner cannot:
      # the real Apple media and beauty shims compile, and the headless lifecycle
      # leak proof in the test step runs here.
      - name: build and test
        run: nix develop -c zig build test --summary all
        env:
          GOSS_PROBES: "1"
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-conformance-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
      - name: cache health
        if: always()
        run: |
          {
            echo "cache health: vendor=${{ steps.vendor.outputs.cache-hit || 'miss' }} models=${{ steps.models.outputs.cache-hit || 'miss' }} zigcache=${{ steps.zigcache.outputs.cache-matched-key || 'miss' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # The runner uses the repository's flake, so it builds with the zig 0.16.0 a developer's
      # shell has, pinned by flake.lock.
      - name: set up nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: actions/cache@v4
        id: vendor
        with:
          path: |
            .vendor
            .vendor-archives
          key: vendor-${{ hashFiles('third_party/**/pin.zon') }}
      - name: vendor sync
        run: nix develop -c zig build vendor-sync
      - uses: actions/cache/restore@v4
        id: zigcache
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-android-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
          restore-keys: |
            zigcache-android-${{ runner.os }}-${{ hashFiles('.zigversion') }}-
      - name: android library
        run: nix develop -c zig build android
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-android-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
      - name: cache health
        if: always()
        run: |
          {
            echo "cache health: vendor=${{ steps.vendor.outputs.cache-hit || 'miss' }} models=${{ steps.models.outputs.cache-hit || 'miss' }} zigcache=${{ steps.zigcache.outputs.cache-matched-key || 'miss' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: install
        run: bun install
        working-directory: sdk/ts
      - name: build
        run: bun run build
        working-directory: sdk/ts
      - name: test
        run: bun test
        working-directory: sdk/ts

  lens-shaders:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The runner uses the repository's flake, so it builds with the zig 0.16.0 a developer's
      # shell has, pinned by flake.lock.
      - name: set up nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: actions/cache@v4
        id: vendor
        with:
          path: |
            .vendor
            .vendor-archives
          key: vendor-${{ hashFiles('third_party/**/pin.zon') }}
      - name: vendor sync
        run: nix develop -c zig build vendor-sync
      - uses: actions/cache/restore@v4
        id: zigcache
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-lens-shaders-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
          restore-keys: |
            zigcache-lens-shaders-${{ runner.os }}-${{ hashFiles('.zigversion') }}-
      - name: lens validator shader tests
        run: nix develop -c zig build test -Dlens-shaders=true
      - name: validate reference lenses
        run: nix develop -c zig build lens-validate-reference
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-lens-shaders-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
      - name: cache health
        if: always()
        run: |
          {
            echo "cache health: vendor=${{ steps.vendor.outputs.cache-hit || 'miss' }} models=${{ steps.models.outputs.cache-hit || 'miss' }} zigcache=${{ steps.zigcache.outputs.cache-matched-key || 'miss' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  macos-conformance:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # The runner uses the repository's flake, so it builds with the zig 0.16.0 a developer's
      # shell has, pinned by flake.lock.
      - name: set up nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: actions/cache@v4
        with:
          path: |
            .vendor
            .vendor-archives
          key: vendor-${{ hashFiles('third_party/**/pin.zon') }}
      - name: vendor sync
        run: nix develop -c zig build vendor-sync
      - uses: actions/cache@v4
        with:
          path: .models
          key: models-${{ hashFiles('third_party/models.lock') }}
      - name: fetch models
        run: nix develop -c zig build fetch-models
      # The pixel conformance suite renders through bgfx/Metal, which a
      # macos runner has and a Linux runner does not, moving the render
      # proofs off the local-only bar. A headless runner that cannot
      # present surfaces the gap here rather than hiding it.
      - name: conformance
        run: nix develop -c zig build conformance
        env:
          GOSS_PROBES: "1"

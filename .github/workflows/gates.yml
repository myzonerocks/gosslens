name: gates

# Push runs on main exist to validate the merge and to save the warm
# build caches; pull request runs restore those caches and never save
# compilation state, so the shared cache pool stays unevicted and every
# fresh branch starts from main's warm world instead of a cold build.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which areas a change touches, so the long lanes are not paid for a docs
  # edit. Unknown or unreadable base: every area reads true, so a gate is
  # skipped only when the diff positively says it is untouched.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      engine: ${{ steps.areas.outputs.engine }}
      ts: ${{ steps.areas.outputs.ts }}
      kotlin: ${{ steps.areas.outputs.kotlin }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: areas
        id: areas
        run: |
          set -euo pipefail
          all() { printf 'engine=true\nts=true\nkotlin=true\n' >> "$GITHUB_OUTPUT"; }
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          case "$base" in
            ""|0000000000000000000000000000000000000000) echo "no base to diff; every gate runs"; all; exit 0 ;;
          esac
          git cat-file -e "${base}^{commit}" 2>/dev/null || { echo "base $base is not here; every gate runs"; all; exit 0; }
          files=$(git diff --name-only "$base" HEAD)
          echo "changed:"; echo "$files" | sed 's/^/  /'
          # A workflow edit reruns everything: the lanes themselves changed.
          if echo "$files" | grep -qE '^\.github/workflows/'; then echo "workflows touched; every gate runs"; all; exit 0; fi
          engine=false; ts=false; kotlin=false
          if echo "$files" | grep -qE '^(core|adapters|lenses|include|tools|third_party|nix|harness)/|^(build\.zig|build\.zig\.zon|\.zigversion|flake\.nix|flake\.lock)$'; then engine=true; fi
          if echo "$files" | grep -qE '^sdk/ts/'; then ts=true; fi
          if echo "$files" | grep -qE '^sdk/kotlin/'; then kotlin=true; fi
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          echo "ts=$ts" >> "$GITHUB_OUTPUT"
          echo "kotlin=$kotlin" >> "$GITHUB_OUTPUT"
          echo "engine=$engine ts=$ts kotlin=$kotlin"

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The runner uses the repository's flake, so it builds with the zig 0.17.1 a developer's
      # shell has, pinned by flake.lock.
      - name: set up nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: pr title shape
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s' "$PR_TITLE" > "$RUNNER_TEMP/pr_title.txt"
          nix develop -c zig build gate -- --pr-title "$RUNNER_TEMP/pr_title.txt"
      - name: pr body shape
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_body.txt"
          nix develop -c zig build gate -- --pr-body "$RUNNER_TEMP/pr_body.txt"
      - name: commit provenance
        if: github.event_name == 'pull_request'
        run: nix develop -c zig build gate -- --log "origin/${{ github.base_ref }}..HEAD"
      - uses: actions/cache@v4
        id: vendor
        with:
          path: |
            .vendor
            .vendor-archives
          key: vendor-${{ hashFiles('third_party/**/pin.zon') }}
      - name: vendor sync
        run: nix develop -c zig build vendor-sync
      - uses: actions/cache@v4
        id: models
        with:
          path: .models
          key: models-${{ hashFiles('third_party/models.lock') }}
      - name: fetch models
        run: nix develop -c zig build fetch-models
      - uses: actions/cache/restore@v4
        id: zigcache
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
          restore-keys: |
            zigcache-${{ runner.os }}-${{ hashFiles('.zigversion') }}-
      # One compiler process peaks near 15 GB on these targets, which is the
      # whole runner; the build finished with 103 MB to spare and all of the
      # stock swap used, so give it somewhere to go before it starts.
      - name: swap headroom
        run: |
          # The runner already keeps a swapfile at /swapfile and holds it open,
          # so the extra one takes its own name. Headroom is not a gate: if the
          # box refuses it, say so and let the build answer for itself.
          if sudo fallocate -l 12G /swap-extra 2>&1 \
            && sudo chmod 600 /swap-extra \
            && sudo mkswap /swap-extra >/dev/null \
            && sudo swapon /swap-extra; then
            echo "swap headroom: 12G added"
          else
            echo "swap headroom: unavailable, continuing on the stock amount"
          fi
          free -m
      - name: gate suite
        run: nix develop -c zig build ci
        env:
          GOSS_PROBES: "1"
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
      - name: cache health
        if: always()
        run: |
          {
            echo "cache health: vendor=${{ steps.vendor.outputs.cache-hit || 'miss' }} models=${{ steps.models.outputs.cache-hit || 'miss' }} zigcache=${{ steps.zigcache.outputs.cache-matched-key || 'miss' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  tracking:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # The runner uses the repository's flake, so it builds with the zig 0.17.1 a developer's
      # shell has, pinned by flake.lock.
      - name: set up nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: actions/cache@v4
        id: vendor
        with:
          path: |
            .vendor
            .vendor-archives
          key: vendor-${{ hashFiles('third_party/**/pin.zon') }}
      - name: vendor sync
        run: nix develop -c zig build vendor-sync
      - uses: actions/cache@v4
        id: models
        with:
          path: .models
          key: models-${{ hashFiles('third_party/models.lock') }}
      - name: fetch models
        run: nix develop -c zig build fetch-models
      - uses: actions/cache/restore@v4
        id: zigcache
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-tracking-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
          restore-keys: |
            zigcache-tracking-${{ runner.os }}-${{ hashFiles('.zigversion') }}-
      - name: tracking harness
        run: nix develop -c zig build tracking-harness
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-tracking-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
      - name: cache health
        if: always()
        run: |
          {
            echo "cache health: vendor=${{ steps.vendor.outputs.cache-hit || 'miss' }} models=${{ steps.models.outputs.cache-hit || 'miss' }} zigcache=${{ steps.zigcache.outputs.cache-matched-key || 'miss' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Both macos gates share one runner: a second macos job spent fifteen minutes
  # queued and was dropped without running, and the setup is the same anyway.
  macos-build:
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      # The runner uses the repository's flake, so it builds with the zig 0.17.1 a developer's
      # shell has, pinned by flake.lock.
      - name: set up nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: actions/cache@v4
        id: vendor
        with:
          path: |
            .vendor
            .vendor-archives
          key: vendor-${{ hashFiles('third_party/**/pin.zon') }}
      - name: vendor sync
        run: nix develop -c zig build vendor-sync
      - uses: actions/cache@v4
        id: models
        with:
          path: .models
          key: models-${{ hashFiles('third_party/models.lock') }}
      - name: fetch models
        run: nix develop -c zig build fetch-models
      - uses: actions/cache/restore@v4
        id: zigcache
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-conformance-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
          restore-keys: |
            zigcache-conformance-${{ runner.os }}-${{ hashFiles('.zigversion') }}-
      # Full GPU conformance needs a window and a display, so it stays the local
      # merge bar. This job gives the macOS-only coverage a Linux runner cannot:
      # the real Apple media and beauty shims compile, and the headless lifecycle
      # leak proof in the test step runs here.
      - name: build and test
        run: nix develop -c zig build test --summary all
        env:
          GOSS_PROBES: "1"
      # The pixel conformance suite renders through bgfx/Metal, which a
      # macos runner has and a Linux runner does not, moving the render
      # proofs off the local-only bar. A headless runner that cannot
      # present surfaces the gap here rather than hiding it.
      - name: conformance
        run: nix develop -c zig build conformance
        env:
          GOSS_PROBES: "1"
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-conformance-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
      - name: cache health
        if: always()
        run: |
          {
            echo "cache health: vendor=${{ steps.vendor.outputs.cache-hit || 'miss' }} models=${{ steps.models.outputs.cache-hit || 'miss' }} zigcache=${{ steps.zigcache.outputs.cache-matched-key || 'miss' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  android:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
      # The runner uses the repository's flake, so it builds with the zig 0.17.1 a developer's
      # shell has, pinned by flake.lock.
      - name: set up nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: actions/cache@v4
        id: vendor
        with:
          path: |
            .vendor
            .vendor-archives
          key: vendor-${{ hashFiles('third_party/**/pin.zon') }}
      - name: vendor sync
        run: nix develop -c zig build vendor-sync
      - uses: actions/cache/restore@v4
        id: zigcache
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-android-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
          restore-keys: |
            zigcache-android-${{ runner.os }}-${{ hashFiles('.zigversion') }}-
      # See cold.yml: one job per core is what the reaper kills.
      # One compiler process peaks near 15 GB on these targets, which is the
      # whole runner; the build finished with 103 MB to spare and all of the
      # stock swap used, so give it somewhere to go before it starts.
      - name: swap headroom
        run: |
          # The runner already keeps a swapfile at /swapfile and holds it open,
          # so the extra one takes its own name. Headroom is not a gate: if the
          # box refuses it, say so and let the build answer for itself.
          if sudo fallocate -l 12G /swap-extra 2>&1 \
            && sudo chmod 600 /swap-extra \
            && sudo mkswap /swap-extra >/dev/null \
            && sudo swapon /swap-extra; then
            echo "swap headroom: 12G added"
          else
            echo "swap headroom: unavailable, continuing on the stock amount"
          fi
          free -m
      - name: android library
        run: |
          ( while :; do
              echo "RES $(date -u +%H:%M:%S) avail=$(free -m | awk '/^Mem:/{print $7}')MB swap=$(free -m | awk '/^Swap:/{print $3}')MB root_free=$(df -m / | awk 'NR==2{print $4}')MB top=$(ps -eo rss=,comm= --sort=-rss 2>/dev/null | head -3 | awk '{printf "%s:%dMB ", $2, $1/1024}' || true)"
              sleep 30
            done ) &
          res_pid=$!
          trap 'kill $res_pid 2>/dev/null || true' EXIT
          nix develop -c zig build android
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-android-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
      - name: cache health
        if: always()
        run: |
          {
            echo "cache health: vendor=${{ steps.vendor.outputs.cache-hit || 'miss' }} models=${{ steps.models.outputs.cache-hit || 'miss' }} zigcache=${{ steps.zigcache.outputs.cache-matched-key || 'miss' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.0
      - name: install
        run: bun install
        working-directory: sdk/ts
      - name: build
        run: bun run build
        working-directory: sdk/ts
      - name: test
        run: bun test
        working-directory: sdk/ts

  # Nothing built the kotlin SDK until a release did, so a module pinned to an
  # api level that does not exist reached a publish before anyone noticed. The
  # engine counts too: these unit tests assert the values the C ABI freezes.
  kotlin:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.kotlin == 'true' || needs.changes.outputs.engine == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # The action's own default list asks for a package sdkmanager dropped, so
      # name the platform the library and its demo module compile against.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 platforms;android-37.0
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('sdk/kotlin/**/*.gradle.kts', 'sdk/kotlin/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      # ktlint's gradle plugin waits for the standalone kotlin plugin, which
      # cannot be applied beside the one AGP registers, so it only ever reached
      # the build scripts. The cli reads the sources, by digest.
      - name: ktlint the kotlin sources
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/ktlint.jar"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
            "https://repo1.maven.org/maven2/com/pinterest/ktlint/ktlint-cli/1.8.0/ktlint-cli-1.8.0-all.jar" -o "$jar"
          echo "369ad2b789f95a011f807e1fcb690ccef80bd7cd014fd139e73ae82dcc0baeab  $jar" | sha256sum -c -
          cd sdk/kotlin
          java -jar "$jar" "src/**/*.kt" "demo/src/**/*.kt"
      # assemble covers the demo app too, which is where the unbuildable
      # compileSdk was hiding. The .so is only packaged, never read.
      - name: lint, test and build the kotlin sdk
        run: cd sdk/kotlin && ./gradlew --no-daemon ktlintCheck test assemble

  lens-shaders:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # The runner uses the repository's flake, so it builds with the zig 0.17.1 a developer's
      # shell has, pinned by flake.lock.
      - name: set up nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: actions/cache@v4
        id: vendor
        with:
          path: |
            .vendor
            .vendor-archives
          key: vendor-${{ hashFiles('third_party/**/pin.zon') }}
      - name: vendor sync
        run: nix develop -c zig build vendor-sync
      - uses: actions/cache/restore@v4
        id: zigcache
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-lens-shaders-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
          restore-keys: |
            zigcache-lens-shaders-${{ runner.os }}-${{ hashFiles('.zigversion') }}-
      # See cold.yml: concurrent test binaries, each its own zig process.
      # One compiler process peaks near 15 GB on these targets, which is the
      # whole runner; the build finished with 103 MB to spare and all of the
      # stock swap used, so give it somewhere to go before it starts.
      - name: swap headroom
        run: |
          # The runner already keeps a swapfile at /swapfile and holds it open,
          # so the extra one takes its own name. Headroom is not a gate: if the
          # box refuses it, say so and let the build answer for itself.
          if sudo fallocate -l 12G /swap-extra 2>&1 \
            && sudo chmod 600 /swap-extra \
            && sudo mkswap /swap-extra >/dev/null \
            && sudo swapon /swap-extra; then
            echo "swap headroom: 12G added"
          else
            echo "swap headroom: unavailable, continuing on the stock amount"
          fi
          free -m
      - name: lens validator shader tests
        run: |
          ( while :; do
              echo "RES $(date -u +%H:%M:%S) avail=$(free -m | awk '/^Mem:/{print $7}')MB swap=$(free -m | awk '/^Swap:/{print $3}')MB root_free=$(df -m / | awk 'NR==2{print $4}')MB top=$(ps -eo rss=,comm= --sort=-rss 2>/dev/null | head -3 | awk '{printf "%s:%dMB ", $2, $1/1024}' || true)"
              sleep 30
            done ) &
          res_pid=$!
          trap 'kill $res_pid 2>/dev/null || true' EXIT
          nix develop -c zig build test -Dlens-shaders=true -j1
      - name: validate reference lenses
        run: nix develop -c zig build lens-validate-reference
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-lens-shaders-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
      - name: cache health
        if: always()
        run: |
          {
            echo "cache health: vendor=${{ steps.vendor.outputs.cache-hit || 'miss' }} models=${{ steps.models.outputs.cache-hit || 'miss' }} zigcache=${{ steps.zigcache.outputs.cache-matched-key || 'miss' }}"
          } >> "$GITHUB_STEP_SUMMARY"


name: gates

# Push runs on main exist to validate the merge and to save the warm
# build caches; pull request runs restore those caches and never save
# compilation state, so the shared cache pool stays unevicted and every
# fresh branch starts from main's warm world instead of a cold build.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        id: zigtool
        with:
          path: .local/zig
          key: zig-${{ runner.os }}-${{ hashFiles('.zigversion') }}
      - name: toolchain
        run: |
          tools/toolchain-sync
          echo "$PWD/.local/zig/current" >> "$GITHUB_PATH"
      - name: pr body shape
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_body.txt"
          zig build gate -- --pr-body "$RUNNER_TEMP/pr_body.txt"
      - uses: actions/cache@v4
        id: vendor
        with:
          path: |
            .vendor
            .vendor-archives
          key: vendor-${{ hashFiles('third_party/**/pin.zon') }}
      - name: vendor sync
        run: zig build vendor-sync
      - uses: actions/cache@v4
        id: models
        with:
          path: .models
          key: models-${{ hashFiles('third_party/models.lock') }}
      - name: fetch models
        run: zig build fetch-models
      - uses: actions/cache/restore@v4
        id: zigcache
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
          restore-keys: |
            zigcache-${{ runner.os }}-${{ hashFiles('.zigversion') }}-
      - name: gate suite
        run: zig build ci
        env:
          GOSS_PROBES: "1"
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
      - name: cache health
        if: always()
        run: |
          {
            echo "cache health: zigtool=${{ steps.zigtool.outputs.cache-hit || 'miss' }} vendor=${{ steps.vendor.outputs.cache-hit || 'miss' }} models=${{ steps.models.outputs.cache-hit || 'miss' }} zigcache=${{ steps.zigcache.outputs.cache-matched-key || 'miss' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  tracking:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: zigtool
        with:
          path: .local/zig
          key: zig-${{ runner.os }}-${{ hashFiles('.zigversion') }}
      - name: toolchain
        run: |
          tools/toolchain-sync
          echo "$PWD/.local/zig/current" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        id: vendor
        with:
          path: |
            .vendor
            .vendor-archives
          key: vendor-${{ hashFiles('third_party/**/pin.zon') }}
      - name: vendor sync
        run: zig build vendor-sync
      - uses: actions/cache@v4
        id: models
        with:
          path: .models
          key: models-${{ hashFiles('third_party/models.lock') }}
      - name: fetch models
        run: zig build fetch-models
      - uses: actions/cache/restore@v4
        id: zigcache
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-tracking-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
          restore-keys: |
            zigcache-tracking-${{ runner.os }}-${{ hashFiles('.zigversion') }}-
      - name: tracking harness
        run: zig build tracking-harness
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-tracking-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
      - name: cache health
        if: always()
        run: |
          {
            echo "cache health: zigtool=${{ steps.zigtool.outputs.cache-hit || 'miss' }} vendor=${{ steps.vendor.outputs.cache-hit || 'miss' }} models=${{ steps.models.outputs.cache-hit || 'miss' }} zigcache=${{ steps.zigcache.outputs.cache-matched-key || 'miss' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  macos-build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: zigtool
        with:
          path: .local/zig
          key: zig-${{ runner.os }}-${{ hashFiles('.zigversion') }}
      - name: toolchain
        run: |
          tools/toolchain-sync
          echo "$PWD/.local/zig/current" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        id: vendor
        with:
          path: |
            .vendor
            .vendor-archives
          key: vendor-${{ hashFiles('third_party/**/pin.zon') }}
      - name: vendor sync
        run: zig build vendor-sync
      - uses: actions/cache@v4
        id: models
        with:
          path: .models
          key: models-${{ hashFiles('third_party/models.lock') }}
      - name: fetch models
        run: zig build fetch-models
      - uses: actions/cache/restore@v4
        id: zigcache
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-conformance-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
          restore-keys: |
            zigcache-conformance-${{ runner.os }}-${{ hashFiles('.zigversion') }}-
      # Full GPU conformance needs a window and a display, so it stays the local
      # merge bar. This job gives the macOS-only coverage a Linux runner cannot:
      # the real Apple media and beauty shims compile, and the headless lifecycle
      # leak proof in the test step runs here.
      - name: build and test
        run: zig build test --summary all
        env:
          GOSS_PROBES: "1"
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-conformance-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
      - name: cache health
        if: always()
        run: |
          {
            echo "cache health: zigtool=${{ steps.zigtool.outputs.cache-hit || 'miss' }} vendor=${{ steps.vendor.outputs.cache-hit || 'miss' }} models=${{ steps.models.outputs.cache-hit || 'miss' }} zigcache=${{ steps.zigcache.outputs.cache-matched-key || 'miss' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: zigtool
        with:
          path: .local/zig
          key: zig-${{ runner.os }}-${{ hashFiles('.zigversion') }}
      - name: toolchain
        run: |
          tools/toolchain-sync
          echo "$PWD/.local/zig/current" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        id: vendor
        with:
          path: |
            .vendor
            .vendor-archives
          key: vendor-${{ hashFiles('third_party/**/pin.zon') }}
      - name: vendor sync
        run: zig build vendor-sync
      - uses: actions/cache/restore@v4
        id: zigcache
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-android-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
          restore-keys: |
            zigcache-android-${{ runner.os }}-${{ hashFiles('.zigversion') }}-
      - name: android library
        run: zig build android
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-android-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
      - name: cache health
        if: always()
        run: |
          {
            echo "cache health: zigtool=${{ steps.zigtool.outputs.cache-hit || 'miss' }} vendor=${{ steps.vendor.outputs.cache-hit || 'miss' }} models=${{ steps.models.outputs.cache-hit || 'miss' }} zigcache=${{ steps.zigcache.outputs.cache-matched-key || 'miss' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: install
        run: bun install
        working-directory: sdk/ts
      - name: build
        run: bun run build
        working-directory: sdk/ts
      - name: test
        run: bun test
        working-directory: sdk/ts

  lens-shaders:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: zigtool
        with:
          path: .local/zig
          key: zig-${{ runner.os }}-${{ hashFiles('.zigversion') }}
      - name: toolchain
        run: |
          tools/toolchain-sync
          echo "$PWD/.local/zig/current" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        id: vendor
        with:
          path: |
            .vendor
            .vendor-archives
          key: vendor-${{ hashFiles('third_party/**/pin.zon') }}
      - name: vendor sync
        run: zig build vendor-sync
      - uses: actions/cache/restore@v4
        id: zigcache
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-lens-shaders-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
          restore-keys: |
            zigcache-lens-shaders-${{ runner.os }}-${{ hashFiles('.zigversion') }}-
      - name: lens validator shader tests
        run: zig build test -Dlens-shaders=true
      - name: validate reference lenses
        run: zig build lens-validate-reference
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-lens-shaders-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
      - name: cache health
        if: always()
        run: |
          {
            echo "cache health: zigtool=${{ steps.zigtool.outputs.cache-hit || 'miss' }} vendor=${{ steps.vendor.outputs.cache-hit || 'miss' }} models=${{ steps.models.outputs.cache-hit || 'miss' }} zigcache=${{ steps.zigcache.outputs.cache-matched-key || 'miss' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  macos-conformance:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .local/zig
          key: zig-${{ runner.os }}-${{ hashFiles('.zigversion') }}
      - name: toolchain
        run: |
          tools/toolchain-sync
          echo "$PWD/.local/zig/current" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            .vendor
            .vendor-archives
          key: vendor-${{ hashFiles('third_party/**/pin.zon') }}
      - name: vendor sync
        run: zig build vendor-sync
      - uses: actions/cache@v4
        with:
          path: .models
          key: models-${{ hashFiles('third_party/models.lock') }}
      - name: fetch models
        run: zig build fetch-models
      # The pixel proofs render through bgfx/Metal, which the hosted macos
      # runner has. The beauty pass is the exception: gpupixel draws through
      # NSOpenGL, and the runner's virtual display cannot create a pixel
      # format, so that pass degrades to a silent no-op and hashes wrong.
      # Every other proof gates here against the pinned baseline; the
      # beauty-baseline line is reported, not compared, and gates on a mac
      # with a display through the local zig build conformance.
      - name: conformance
        env:
          GOSS_PROBES: "1"
        run: |
          hosted_skip=beauty-baseline
          zig build conformance -- --print > "$RUNNER_TEMP/current.txt"
          grep -E '^[a-z0-9-]+ [0-9a-f]{64}$' "$RUNNER_TEMP/current.txt" > "$RUNNER_TEMP/got.txt"
          grep -q "^$hosted_skip " "$RUNNER_TEMP/got.txt" || { echo "conformance: $hosted_skip did not run"; exit 1; }
          grep -v "^$hosted_skip " lenses/conformance-baseline.txt > "$RUNNER_TEMP/want.txt"
          grep -v "^$hosted_skip " "$RUNNER_TEMP/got.txt" > "$RUNNER_TEMP/got-hosted.txt"
          if ! diff -u "$RUNNER_TEMP/want.txt" "$RUNNER_TEMP/got-hosted.txt"; then
            echo "conformance: hosted proofs differ from lenses/conformance-baseline.txt"
            exit 1
          fi
          echo "conformance: $(wc -l < "$RUNNER_TEMP/want.txt" | tr -d ' ') proofs match the baseline; $hosted_skip needs NSOpenGL and gates locally"

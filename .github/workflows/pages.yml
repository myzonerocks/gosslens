name: pages

# The site gates and publishes on its own, never waiting for a core lane.
# Publishing pushes the built site to gh-pages, which is what turns Pages on:
# GitHub creates the site from the branch, so no administration token is
# needed and a repository that goes public serves again by itself.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  # Fires the moment the repository changes from private to public, which is
  # when Pages becomes available again and the site should come back on its own.
  public:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.0
      - name: install
        working-directory: site
        run: bun install --frozen-lockfile
      - name: check
        working-directory: site
        run: bun run check
      - name: build
        working-directory: site
        run: bun run build
      - name: browsers
        working-directory: site
        run: bunx playwright install --with-deps chromium firefox webkit
      - name: test
        working-directory: site
        run: bun run test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: site/playwright-report
          retention-days: 7

      # The event payload carries the visibility as it was when the event fired,
      # which is stale if the repository flipped since. Ask for the live answer.
      - name: visibility
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          public=false
          if [ "${{ github.event_name }}" != "pull_request" ] &&
             [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" = "public" ]; then
            public=true
          fi
          echo "public=$public" >> "$GITHUB_OUTPUT"

      # A generated branch, replaced whole each time. .nojekyll keeps the
      # underscore-prefixed assets a bundler emits from being skipped.
      - name: publish
        if: steps.visibility.outputs.public == 'true'
        working-directory: site/dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch .nojekyll
          git init -q
          git checkout -qb gh-pages
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "the built documentation site"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

name: pages

# The documentation site is its own tree under site/, so it gates and
# publishes on its own and never waits for a core lane. Publishing needs
# Pages, which a private repository on this plan does not get, so those
# steps stand down until the repository is public.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publishable: ${{ steps.visibility.outputs.public }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.0
      - name: install
        working-directory: site
        run: bun install --frozen-lockfile
      - name: check
        working-directory: site
        run: bun run check
      - name: build
        working-directory: site
        run: bun run build
      - name: browsers
        working-directory: site
        run: bunx playwright install --with-deps chromium firefox webkit
      - name: test
        working-directory: site
        run: bun run test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: site/playwright-report
          retention-days: 7
      - name: visibility
        id: visibility
        run: echo "public=${{ github.event.repository.visibility == 'public' && github.event_name != 'pull_request' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
        if: steps.visibility.outputs.public == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.visibility.outputs.public == 'true'
        with:
          path: site/dist

  deploy:
    needs: build
    if: needs.build.outputs.publishable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

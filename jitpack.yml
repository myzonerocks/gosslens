# Builds io.github.avosa:gosslens from a tagged commit for consumers who resolve
# it over JitPack. JitPack compiles from source, so unlike the Maven Central AAR
# (whose .so our CI prebuilds) this builds the native core here first with zig
# build android, then packages it. Heavier, so Maven Central is recommended.
jdk:
  - openjdk21
install:
  - tools/toolchain-sync
  - export PATH="$PWD/.local/zig/current:$PATH" && zig build vendor-sync && zig build android
  - cd sdk/kotlin && ./gradlew publishToMavenLocal -x signMavenPublication
